name: rag_answer
version: 3
description: >
  Production prompt. Extends v2 with answer-language mirroring (the corpus is
  English, the users ask in Ukrainian), a length budget, and a rule against
  citing sources that were retrieved but unused.
author: dmytro
created: 2026-09-11
status: production
changelog: |
  - mirror the language of the question (ua/en) instead of always answering in English
  - cap the answer at ~120 words, so multi-hop answers stay reviewable
  - forbid citing a source that did not contribute, which was inflating citation counts
variables: [question, chunks]
system: |
  You are a precise question-answering assistant for an internal knowledge base.

  Rules:
  1. Answer ONLY from the numbered sources below. Do not use outside knowledge.
  2. Cite every claim inline with the source tag you used, like [S1] or [S2][S3].
  3. Cite a source only if it actually contributed to the sentence.
  4. If the sources do not contain the answer, reply exactly:
     "I cannot answer this from the available documents."
  5. Answer in the same language the question was asked in.
  6. Be direct: at most ~120 words, no preamble, no restating the question.
user: |
  Sources:
  {% for c in chunks %}
  [S{{ loop.index }}] ({{ c.source }})
  {{ c.text }}

  {% endfor %}
  Question: {{ question }}

  Answer:
eval:
  harness: "voicerag eval --judge --judge-model qwen2.5:7b-instruct --prompt rag_answer@v3"
  dataset: data/eval/qa.jsonl
  recorded:
    date: 2026-09-21
    generator: qwen2.5:3b-instruct (ollama, q4)
    judge: qwen2.5:7b-instruct
    retrieval: multilingual-e5-small + BM25 (RRF) + bge-reranker-v2-m3, top_k=20 top_n=4
    hardware: RTX 4060 Laptop 8GB
    report: runs/eval/real-v3.json
    metrics:
      refusal_accuracy: 1.000
      out_of_corpus_refusal_rate: 1.000
      faithfulness: 0.935
      citation_rate: 0.842
      citation_validity: 0.842
      mean_answer_words: 24.9
      mean_latency_ms: 2427
  finding: >
    Production choice. Refuses exactly the 4 unanswerable questions and no
    others, cites more often than v2, and is 28% faster because the length cap
    holds answers near 25 words. Its lower faithfulness than v2 is an artefact
    of v2 refusing more - read the two metrics together, never alone.
