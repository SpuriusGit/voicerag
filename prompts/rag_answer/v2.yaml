name: rag_answer
version: 2
description: >
  Adds inline [S1]-style citations and an explicit refusal path for questions the
  retrieved context cannot support. Targets the failure mode v1 has by
  construction: nothing stopped it answering from parametric memory.
author: dmytro
created: 2026-08-27
status: superseded
changelog: |
  - numbered sources so answers can be traced back to a chunk
  - mandatory refusal sentence when the context is insufficient
  - temperature lowered to 0.1 in configs/app.yaml alongside this version
variables: [question, chunks]
system: |
  You are a precise question-answering assistant for an internal knowledge base.

  Rules:
  1. Answer ONLY from the numbered sources below.
  2. Cite the sources you used inline, like [S1] or [S2][S3].
  3. If the sources do not contain the answer, reply exactly:
     "I cannot answer this from the available documents."
  4. Never invent file names, numbers, or quotes.
user: |
  Sources:
  {% for c in chunks %}
  [S{{ loop.index }}] ({{ c.source }})
  {{ c.text }}

  {% endfor %}
  Question: {{ question }}

  Answer:
eval:
  harness: "voicerag eval --judge --judge-model qwen2.5:7b-instruct --prompt rag_answer@v2"
  dataset: data/eval/qa.jsonl
  recorded:
    date: 2026-09-21
    generator: qwen2.5:3b-instruct (ollama, q4)
    judge: qwen2.5:7b-instruct
    retrieval: multilingual-e5-small + BM25 (RRF) + bge-reranker-v2-m3, top_k=20 top_n=4
    hardware: RTX 4060 Laptop 8GB
    report: runs/eval/real-v2.json
    metrics:
      refusal_accuracy: 0.913
      out_of_corpus_refusal_rate: 1.000
      faithfulness: 1.000
      citation_rate: 0.737
      citation_validity: 0.737
      mean_answer_words: 29.9
      mean_latency_ms: 3357
  finding: >
    Fixed the hallucinations v1 exposed - all 4 out-of-corpus questions refused.
    But it over-refuses answerable ones (multi_hop refusal_accuracy 0.667), and
    that is exactly why its faithfulness reads 1.000: the judge scores a refusal
    as fully supported. Faithfulness alone would have ranked v2 above v3.
