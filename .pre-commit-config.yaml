repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.2
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
        exclude: ^prompts/          # jinja braces in the templates
      - id: check-json
      - id: check-added-large-files
        args: [--maxkb=512]         # model weights and indexes never belong in git
      - id: check-merge-conflict
      - id: detect-private-key

  - repo: local
    hooks:
      - id: prompts-load
        name: every prompt version parses and renders
        entry: python -c "from voicerag.prompts import PromptRegistry; PromptRegistry('prompts').catalog()"
        language: system
        pass_filenames: false
        files: ^prompts/
