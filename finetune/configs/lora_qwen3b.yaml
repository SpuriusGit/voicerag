# QLoRA configuration for Qwen2.5-3B-Instruct on a single 8 GB card.
# Rationale for every non-default value is in docs/EXPERIMENTS.md.

base_model: Qwen/Qwen2.5-3B-Instruct
output_dir: runs/lora/qwen3b-rag-style
dataset: data/finetune/train.jsonl
eval_dataset: data/finetune/eval.jsonl
seed: 42

quantization:
  load_in_4bit: true          # 3B at bf16 alone would be ~6 GB, leaving no room for activations
  bnb_4bit_quant_type: nf4
  bnb_4bit_compute_dtype: bfloat16
  bnb_4bit_use_double_quant: true

lora:
  r: 16                       # r=8 underfit on 600 examples, r=64 tripled adapter size for no gain
  alpha: 32
  dropout: 0.05
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj
  task_type: CAUSAL_LM

training:
  num_train_epochs: 3
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 16   # effective batch 16; 8 GB cannot hold more at 2k context
  learning_rate: 2.0e-4
  lr_scheduler_type: cosine
  warmup_ratio: 0.03
  weight_decay: 0.0
  max_seq_length: 2048
  gradient_checkpointing: true      # ~35% slower, ~40% less VRAM — the trade that makes 8 GB work
  bf16: true
  logging_steps: 10
  eval_strategy: epoch
  save_strategy: epoch
  save_total_limit: 2
  optim: paged_adamw_8bit
  report_to: none
