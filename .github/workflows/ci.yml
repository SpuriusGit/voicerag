name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  quality:
    name: lint + types + tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
          pip install -e .

      - name: Lint
        run: |
          ruff check src tests finetune scripts
          ruff format --check src tests finetune scripts

      - name: Type check
        run: mypy

      - name: Tests
        # The suite runs the real pipeline on stub backends: no GPU, no downloads.
        run: pytest -q --cov=voicerag --cov-report=term-missing --cov-report=xml

      - name: Upload coverage
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml

  pipeline:
    name: end-to-end pipeline + quality gate
    runs-on: ubuntu-latest
    env:
      VOICERAG_RAG__EMBEDDER: hashing
      VOICERAG_RAG__RERANKER: noop
      VOICERAG_LLM__BACKEND: echo
      VOICERAG_LLM__MODEL: echo
      VOICERAG_STT__BACKEND: stub
      VOICERAG_RAG__STORE_PATH: storage/index-ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Validate every prompt version renders
        run: voicerag prompts list

      - name: Ingest corpus
        run: voicerag ingest --corpus data/corpus

      - name: Evaluate retrieval
        run: voicerag eval --out runs/ci --run-id ci-${{ github.run_number }}

      - name: Retrieval ablation
        run: python scripts/run_ablation.py

      - name: LoRA pipeline dry run
        run: |
          python finetune/prepare_dataset.py
          python finetune/train_lora.py --dry-run

      - name: Upload evaluation report
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: |
            runs/ci/
            runs/ablation/

  docker:
    name: docker image builds and serves
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build CPU image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          tags: voicerag:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Boot the container and probe /health
        run: |
          docker run -d --name voicerag -p 8000:8000 \
            -e VOICERAG_RAG__EMBEDDER=hashing \
            -e VOICERAG_RAG__RERANKER=noop \
            -e VOICERAG_LLM__BACKEND=echo \
            -e VOICERAG_STT__BACKEND=stub \
            voicerag:ci
          for i in $(seq 1 30); do
            if curl -fsS localhost:8000/health > /dev/null; then break; fi
            sleep 2
          done
          curl -fsS localhost:8000/health | tee /dev/stderr | grep -q '"loaded":true'
          curl -fsS localhost:8000/ask -H 'content-type: application/json' \
            -d '{"question":"How much VRAM does an RTX 4060 have?"}' | grep -q '04_gpu_capacity.md'
          curl -fsS localhost:8000/metrics | grep -q voicerag_stage_latency_seconds

      - name: Container logs on failure
        if: failure()
        run: docker logs voicerag
